<script>// Minimal static renderer for the canvas .dc.html files (no network).
window.DCLogic = class { constructor(p){ this.props = p || {}; this.state = {}; } setState(o){ Object.assign(this.state, o); } forceUpdate(){} };
window.FILES = window.FILES || {};
function parseFile(name){
  let src = FILES[name + '.dc.html'];
  src = src.replace(/<sc-for([^>]*)>(\s*<tr)/g, '<tbody data-scfor$1>$2').replace(/<\/tr>(\s*)<\/sc-for>/g, '</tr>$1</tbody>');
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const xdc = doc.querySelector('x-dc');
  const helmet = xdc.querySelector('helmet'); if (helmet) helmet.remove();
  const script = doc.querySelector('script[data-dc-script]').textContent;
  const Cls = new Function('DCLogic', script + '\nreturn Component;')(window.DCLogic);
  return { tpl: xdc, Cls };
}
function look(scope, path){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  return path.split('.').reduce((o,k) => (o == null ? undefined : o[k]), scope);
}
function interp(str, scope){
  const whole = str.match(/^\s*\{\{([^}]+)\}\}\s*$/);
  if (whole) return look(scope, whole[1]);
  return str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); });
}
function renderNodes(nodes, scope, out, live){
  for (const n of nodes){
    if (n.nodeType === 3){ out.appendChild(document.createTextNode(interp(n.textContent, scope) ?? '')); continue; }
    if (n.nodeType !== 1) continue;
    const tag = n.tagName.toLowerCase();
    if (tag === 'sc-for' || (tag === 'tbody' && n.hasAttribute('data-scfor'))){
      const list = interp(n.getAttribute('list'), scope) || [];
      const as = n.getAttribute('as');
      list.forEach((item, i) => renderNodes(n.childNodes, Object.assign({}, scope, { [as]: item, $index: i }), out, live));
      continue;
    }
    if (tag === 'sc-if'){
      if (interp(n.getAttribute('value'), scope)) renderNodes(n.childNodes, scope, out, live);
      continue;
    }
    if (tag === 'dc-import'){
      out.appendChild(live ? window.__renderInteractive(n.getAttribute('name')) : renderComp(n.getAttribute('name'), {}, {}));
      continue;
    }
    const el = document.createElementNS(n.namespaceURI, n.localName);
    for (const a of n.attributes){
      if (a.name.startsWith('hint-')) continue;
      if (/^on/i.test(a.name)){ const f = interp(a.value, scope); if (live && typeof f === 'function') el.addEventListener('click', (e) => { e.preventDefault(); f(); }); continue; }
      const v = interp(a.value, scope);

    renderNodes(n.childNodes, scope, el, live);
    if (live && n.localName === 'a'){ const h = el.getAttribute('href') || ''; el.addEventListener('click', (e) => { e.preventDefault(); if (/\.dc\.html$/.test(h)) window.__nav(h); }); }
    out.appendChild(el);
  }

}

};

<script>// Interactive shell: keeps one instance per screen, wires clicks and links, plus a guide.
(function(){
  const insts = {};
  const parsed = {};
  function getParsed(name){ if (!parsed[name]) parsed[name] = window.__parse(name); return parsed[name]; }
  function inst(name){
    if (!insts[name]){ const { Cls } = getParsed(name); const i = new Cls({}); i.setState = (o) => { Object.assign(i.state, o); draw(); }; insts[name] = i; }
    return insts[name];
  }
  window.__renderInteractive = function(name){
    const { tpl } = getParsed(name);
    const vals = inst(name).renderVals();
    const frag = document.createElement('div'); frag.style.display = 'contents';
    window.__renderNodes(tpl.childNodes, vals, frag, true);
    return frag;
  };
  const G = window.GUIDE;
  let step = 0;
  function go(k){ step = Math.max(0, Math.min(G.length - 1, k)); window.scrollTo(0,0); draw(); }
  window.__nav = function(file){
    const name = file.replace('.dc.html','');
    const k = G.findIndex(g => g.s === name);
    if (k >= 0) go(k);
  };
  function draw(){
    const g = G[step];
    const host = document.getElementById('screen');
    host.innerHTML = '';
    host.className = g.s === 'Admin' ? 'wide' : 'phone';
    const inner = document.createElement('div');
    inner.className = 'inner';
    inner.appendChild(window.__renderInteractive(g.s));
    host.appendChild(inner);
    fit();
    document.getElementById('gnum').textContent = (step + 1) + ' de ' + G.length;
    const who = document.getElementById('gwho'); who.textContent = g.who; who.style.background = g.bg; who.style.color = g.c;
    document.getElementById('gtitle').textContent = g.t;
    document.getElementById('gbul').innerHTML = g.b.map((t,i) => '<li><span>' + (i+1) + '</span>' + t + '</li>').join('');
    document.getElementById('gtap').textContent = g.tap || '';
    document.getElementById('gtap').style.display = g.tap ? 'block' : 'none';
    document.getElementById('gprev').style.visibility = step === 0 ? 'hidden' : 'visible';
    document.getElementById('gnext').textContent = step === G.length - 1 ? 'Volver a empezar' : 'Siguiente →';
    document.getElementById('gdots').innerHTML = G.map((_,i) => '<i style="background:' + (i === step ? '#ff5a1f' : (i < step ? '#7a3a1e' : '#333')) + '"></i>').join('');
  }
  function fit(){
    const host = document.getElementById('screen');
    const inner = host.firstChild; if (!inner) return;
    const w = host.classList.contains('wide') ? 1280 : 390;
    const h = host.classList.contains('wide') ? 1240 : 844;
    const avail = host.parentElement.clientWidth;
    const s = Math.min(1, avail / w);
    inner.style.transform = 'scale(' + s + ')';
    host.style.width = (w * s) + 'px';
    host.style.height = (h * s) + 'px';
  }
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('gnext').onclick = () => go(step === G.length - 1 ? 0 : step + 1);
    document.getElementById('gprev').onclick = () => go(step - 1);
    draw();
  });
})();
</script>
